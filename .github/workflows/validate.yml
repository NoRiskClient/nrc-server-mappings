name: Validate Server Manifests and Images

on:
  push:
    branches:
      - main
    paths:
      - "servers/**/*.png"
      - "servers/**/manifest.json"

  pull_request_target:
    paths:
      - "servers/**/*.png"
      - "servers/**/manifest.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout base repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR data files (servers/ only)
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --force origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head" \
            "+${BASE_SHA}:refs/remotes/pr/base"

          LINKS=$(git ls-tree -r refs/remotes/pr/head -- servers/ | awk '$1 == "120000" { print $4 }')
          if [ -n "$LINKS" ]; then
            echo "Symlinks are not allowed under servers/:"
            echo "$LINKS"
            exit 1
          fi

          git rm -r --quiet --cached servers >/dev/null 2>&1 || true
          rm -rf servers
          git checkout refs/remotes/pr/head -- servers/

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Get changed server folders (PR only)
        if: github.event_name == 'pull_request_target'
        id: changed-folders
        run: |
          CHANGED_FILES=$(git diff --name-only refs/remotes/pr/base refs/remotes/pr/head | grep '^servers/' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No server files changed"
            echo "folders=" >> $GITHUB_OUTPUT
          else
            FOLDERS=$(echo "$CHANGED_FILES" | cut -d'/' -f2 | sort -u | tr '\n' ',' | sed 's/,$//')
            echo "Changed server folders: $FOLDERS"
            echo "folders=$FOLDERS" >> $GITHUB_OUTPUT
          fi

      - name: Validate manifests (All servers on push to main)
        if: github.event_name == 'push'
        run: npm run validate-manifest

      - name: Validate manifests (Changed servers on PR)
        if: github.event_name == 'pull_request_target' && steps.changed-folders.outputs.folders != ''
        id: validate-pr
        continue-on-error: true
        run: |
          npm run validate-manifest -- --folders="${{ steps.changed-folders.outputs.folders }}" 2>&1 | tee validation-output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Validate image dimensions
        id: validate-images
        continue-on-error: true
        run: |
          npm run validate-images 2>&1 | tee images-output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Post PR Comment with Results
        if: github.event_name == 'pull_request_target' && steps.changed-folders.outputs.folders != ''
        uses: actions/github-script@v8
        env:
          CHECKED_FOLDERS: ${{ steps.changed-folders.outputs.folders }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const postComment = require('./scripts/post-pr-comment.js');
            await postComment({ github, context, core });

      - name: Fail if validation failed
        if: github.event_name == 'pull_request_target' && (steps.validate-pr.outputs.exit_code != '0' || steps.validate-images.outputs.exit_code != '0')
        run: |
          echo "Validation failed. Please check the errors above."
          exit 1
